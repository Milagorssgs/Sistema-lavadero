<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Exitosa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .success-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .success-box h1 { color: var(--success-color); }
    </style>
</head>
<body>
    <div class="success-box">
        <h1>¡Reserva realizada correctamente!</h1>
        <p>Gracias <strong>{{ nombre }}</strong>.</p>
        <p>Su turno ha sido registrado para el día <strong>{{ fecha }}</strong> a las <strong>{{ hora }}</strong>.</p>
        <p>Por favor, asista 5 minutos antes del horario indicado.</p>
        <a href="{{ url_for('reserva_online') }}" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">Volver al inicio</a>
    </div>
</body>
</html>
