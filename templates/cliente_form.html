{% extends 'base.html' %}

{% block content %}
<h2>{{ 'Editar' if cliente else 'Nuevo' }} Cliente</h2>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre" value="{{ cliente.nombre if cliente else '' }}" required>
        </div>
        <div class="form-group">
            <label for="apellido">Apellido *</label>
            <input type="text" id="apellido" name="apellido" value="{{ cliente.apellido if cliente else '' }}" required>
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono *</label>
            <input type="text" id="telefono" name="telefono" value="{{ cliente.telefono if cliente else '' }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ cliente.email if cliente else '' }}">
        </div>
        <div class="form-group">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" value="{{ cliente.direccion if cliente else '' }}">
        </div>
        
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
